name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings (max line length 100)
        flake8 src/ tests/ --count --exit-zero --max-line-length=100 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check src/ tests/ --line-length 100
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=aimusic_eval --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-notebooks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install nbconvert nbformat
    
    - name: Validate notebook structure
      run: |
        python -c "import nbformat; [nbformat.validate(nbformat.read(nb, as_version=4)) for nb in ['notebooks/the_session_notebook.ipynb', 'notebooks/the_synthesis_journal_v2.ipynb', 'notebooks/the_comparative_dashboard.ipynb', 'notebooks/automated_comparison_utility.ipynb']]"
    
    - name: Test notebook imports
      run: |
        jupyter nbconvert --to script notebooks/the_session_notebook.ipynb --stdout | head -50
        python -c "import sys; sys.path.insert(0, 'notebooks'); from compat_imports import *; print('✓ All imports successful')"
      continue-on-error: true

  minimum-version-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.9 (minimum supported)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install with minimum dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test basic imports
      run: |
        python -c "import aimusic_eval; print(f'aimusic_eval v{aimusic_eval.__version__}')"
        python -c "from aimusic_eval.core import exporters, validators, helpers"
        python -c "from aimusic_eval.config import get_output_dir, get_config"
        python -c "from aimusic_eval.schemas import SESSION_SCHEMA"
        echo "✓ All core imports successful"
